<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Conductor - TP8</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Crear Conductor</h1>

    <section id="seccion-crear-conductor" class="seccion">
        <form id="form-conductor" onsubmit="return false;">
            <div class="campo">
                <label for="conductor-nombre">Nombre:</label>
                <input type="text" id="conductor-nombre" placeholder="Nombre completo">
            </div>

            <div class="campo">
                <label for="conductor-edad">Edad:</label>
                <input type="number" id="conductor-edad" placeholder="Edad">
            </div>

            <div class="campo">
                <label for="conductor-tipo-carnet">Tipo de Carnet:</label>
                <select id="conductor-tipo-carnet">
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="A3">A3</option>
                </select>
            </div>

            <div class="campo">
                <label for="conductor-seguro">Seguro:</label>
                <select id="conductor-seguro">
                    <option value="SI">SI</option>
                    <option value="NO">NO</option>
                </select>
            </div>

            <button type="button" id="btn-agregar-conductor" onclick="agregarConductor()">Agregar Conductor</button>
        </form>
    </section>

    <a href="index.html">Volver al inicio</a>

    <script src="script.js"></script>
</body>

</html>
